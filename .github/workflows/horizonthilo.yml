name: Horizont Hilo builds

# Builds QLC+ v4 for our own authoring machines. The live playback MacBook
# runs the stock official 4.13.1 DMG and is deliberately not built here.
#
# Qt 5 everywhere, on purpose: the stock 4.13.1 build bundles QtScript 5 and
# runs RGB scripts through QScriptEngine. A Qt 6 build would use QJSEngine
# instead and could render the same project differently.

on:
  push:
    branches: [ "horizonthilo-*" ]
  workflow_dispatch:

jobs:
  macos-arm64:
    name: macOS arm64 (Mac mini)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          # No libsndfile/mad: we do not bundle audio file decoding, and their
          # absence also makes qmake skip the audio decoder plugins.
          brew install qt@5 fftw libftdi libusb
          echo "QTDIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH

      - name: Report toolchain
        run: |
          echo "QTDIR=$QTDIR"
          "$QTDIR/bin/qmake" -query QT_VERSION
          clang --version | head -1
          echo "--- pkg-config visibility ---"
          for m in fftw3 libftdi1 libusb-1.0; do
            printf '%-12s %s\n' "$m" "$(pkg-config --modversion $m 2>&1 || echo MISSING)"
          done

      # The qmake install rules copy each third-party dylib by its exact
      # soname (platforms/macos/macos.pro and the *-nametool.pri files) and
      # then run install_name_tool on the copy. Homebrew ships several of
      # those names as symlinks to a versioned file, so the copy lands as a
      # dangling link and install_name_tool fails with ENOENT. libusb happens
      # to be a real file, which is why it alone survived.
      # Replace the symlinks with real files up front. Also reports any name
      # that no longer exists, since a soname bump would need a .pri change.
      - name: Dereference Homebrew dylibs
        run: |
          set -u
          fail=0
          while IFS=: read -r mod lib; do
            [ -n "$mod" ] || continue
            libdir=$(pkg-config --variable libdir "$mod" 2>/dev/null || true)
            if [ -z "$libdir" ]; then
              printf '  %-22s no pkg-config module (skipped)\n' "$mod"
              continue
            fi
            f="$libdir/$lib"
            if [ -L "$f" ]; then
              cp -L "$f" "$f.real" && mv -f "$f.real" "$f"
              printf '  %-22s dereferenced %s\n' "$mod" "$lib"
            elif [ -f "$f" ]; then
              printf '  %-22s already a real file\n' "$mod"
            else
              printf '  %-22s MISSING %s (soname changed?)\n' "$mod" "$f"
              fail=1
            fi
          done <<'LIBS'
          libftdi1:libftdi1.2.dylib
          libusb-1.0:libusb-1.0.0.dylib
          fftw3:libfftw3.3.dylib
          LIBS
          [ "$fail" -eq 0 ] || echo "::warning::at least one expected dylib name was missing; the install step may fail"

      - name: Build and package
        run: ./create-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: qlcplus-macos-arm64
          # Deliberately not "*.dmg": that also matches create-dmg's writable
          # rw.* intermediate, which once got uploaded in place of the real
          # image when create-dmg died partway through.
          path: "QLC+_*.dmg"
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfftw3-dev libftdi1-dev libmad0-dev \
            libsndfile1-dev libudev-dev libusb-1.0-0-dev liblo-dev \
            libgl1-mesa-dev libxml2-utils shared-mime-info pkg-config

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          target: desktop
          arch: gcc_64
          modules: qtscript

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake" -DINSTALL_ROOT="$PWD/install_root"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install
        run: cmake --install build

      - name: Package
        run: tar czf qlcplus-linux-x86_64.tar.gz -C install_root .

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: qlcplus-linux-x86_64
          path: qlcplus-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    env:
      QMAKESPEC: win32-g++
      CC: /mingw64/bin/x86_64-w64-mingw32-gcc.exe
      CXX: /mingw64/bin/x86_64-w64-mingw32-g++.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set ENV variables
        shell: bash
        run: |
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          # The .nsi hardcodes OutFile "QLC+_4.13.1.exe", which would ship our
          # fork under a name indistinguishable from a stock build. Stamp the
          # real version in before reading it back.
          ver=$(grep '^!qmlui' variables.pri | sed 's/.*= *//' | tr -d '\r')
          sed -i "s|^OutFile .*|OutFile \"QLC+_${ver}.exe\"|" platforms/windows/qlcplus4Qt5.nsi
          grep '^OutFile' platforms/windows/qlcplus4Qt5.nsi
          echo "OUTFILE=QLC+_${ver}.exe" >> $GITHUB_ENV
          echo "NSIS_SCRIPT=qlcplus4Qt5.nsi" >> $GITHUB_ENV

      - name: Update and install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          release: true
          update: false
          path-type: inherit
          install: >-
            wget
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libmad
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-python-lxml
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-script
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-imageformats
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-declarative
            mingw-w64-x86_64-nsis

      - name: D2XX SDK
        shell: msys2 {0}
        run: |
          set MSYSTEM=MINGW64
          mkdir -p /c/projects/D2XXSDK
          # ftdichip.com now answers 403 to CI runners, so use the copy the
          # QLC+ project hosts - the same source upstream master switched to.
          wget https://qlcplus.org/misc/CDM-v2.12.36.20-WHQL-Certified.zip -O /c/projects/D2XXSDK/cdm.zip
          cd /c/projects/D2XXSDK
          unzip cdm.zip
          cd amd64
          gendef.exe - ftd2xx64.dll > ftd2xx.def
          dlltool -k --input-def ftd2xx.def --dllname ftd2xx64.dll --output-lib libftd2xx.a

      - name: Fix build
        shell: msys2 {0}
        run: |
          set MSYSTEM=MINGW64
          # force a release build
          sed -i -e 's/Debug/Release/g' CMakeLists.txt
          # disable Velleman plugin
          sed -i -e 's/    add_subdirectory(velleman)/#    add_subdirectory(velleman)/g' plugins/CMakeLists.txt
          # fix MSYS2 system path
          sed -i -e 's/$ENV{SystemDrive}\/msys64/D:\/a\/_temp\/msys64/g' platforms/windows/CMakeLists.txt
          # fix project path in NSIS script
          sed -i -e 's/c\:\\projects/d:\\a\\qlcplus/g' platforms/windows/${{env.NSIS_SCRIPT}}

      - name: Configure
        shell: msys2 {0}
        run: |
          set MSYSTEM=MINGW64
          mkdir build
          cd build
          cmake -G "Unix Makefiles" ..

      - name: Build
        shell: msys2 {0}
        run: |
          set MSYSTEM=MINGW64
          cd build
          make -j${NPROC}

      - name: Install
        shell: msys2 {0}
        run: |
          set MSYSTEM=MINGW64
          cd build
          make install/fast
          cd ..
          cp *.qm /c/qlcplus

      - name: Build installation package
        shell: msys2 {0}
        run: |
          set MSYSTEM=MINGW64
          cd /c/qlcplus
          makensis -X'SetCompressor /FINAL lzma' ${{env.NSIS_SCRIPT}}
          mv /c/qlcplus/${{env.OUTFILE}} /d/a/qlcplus/qlcplus

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: qlcplus-windows-x86_64
          path: ${{env.OUTFILE}}
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (self-contained)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfftw3-dev libftdi1-dev libmad0-dev \
            libsndfile1-dev libudev-dev libusb-1.0-0-dev liblo-dev \
            libgl1-mesa-dev libxml2-utils shared-mime-info pkg-config \
            chrpath file desktop-file-utils

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          target: desktop
          arch: gcc_64
          modules: qtscript

      # appimage=ON switches engine/src/CMakeLists.txt to qlcconfig.h.noroot.in,
      # so the baked data/plugin paths are relative instead of rooted at /usr,
      # and platforms/linux/CMakeLists.txt bundles the Qt libraries too.
      - name: Configure
        run: |
          cmake -S . -B build -Dappimage=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake" \
            -DINSTALL_ROOT="$PWD/AppDir"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install
        run: cmake --install build

      # On Linux QLCFile::systemDirectory() uses the baked path verbatim, so a
      # relative one resolves against the working directory. Print what we
      # actually got before assuming any particular layout.
      - name: Report baked paths and layout
        run: |
          echo "=== generated qlcconfig.h ==="
          grep -E 'APPVERSION|PLUGINDIR|FIXTUREDIR|RGBSCRIPTDIR|DATADIR' engine/src/qlcconfig.h || true
          echo "=== AppDir directories ==="
          find AppDir -type d | sort | sed 's|^|  |' | head -40
          echo "=== QLC+ plugins ==="
          find AppDir -name 'lib*.so' -path '*qlcplus*' | sed 's|^|  |' | head -30
          echo "=== bundled Qt libs ==="
          find AppDir -name 'libQt5*.so*' -o -name 'libicu*' | sed 's|^|  |' | head -30
          echo "=== binaries ==="
          find AppDir -type f -perm -u+x -name 'qlcplus*' | sed 's|^|  |'

      - name: Assemble AppDir
        run: |
          set -eu
          cp -v resources/icons/svg/qlcplus.svg AppDir/
          cp -v platforms/linux/qlcplus.desktop AppDir/
          strip AppDir/usr/bin/qlcplus || true
          find AppDir -name 'libqlcplus*.so*' -exec strip {} \; || true

          # QLCFile::systemDirectory() on Linux uses the baked path verbatim,
          # and with appimage=ON that path is relative ("../lib/..."), so it
          # resolves against the working directory. Pick the cwd that makes it
          # land on the real plugin directory - the install root differs
          # depending on how INSTALL_ROOT folds into INSTALLROOT, so detect it
          # rather than assume.
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib/x86_64-linux-gnu:$HERE/usr/lib:$HERE/lib/x86_64-linux-gnu:$HERE/lib:${LD_LIBRARY_PATH:-}"
          for base in "$HERE/usr" "$HERE/usr/bin"; do
              if [ -d "$base/../lib/qt5/plugins/qlcplus" ] || [ -d "$base/../lib/x86_64-linux-gnu/qt5/plugins/qlcplus" ]; then
                  cd "$base" || exit 1
                  break
              fi
          done
          for p in "$HERE/usr/lib/x86_64-linux-gnu/qt5/plugins" "$HERE/usr/lib/qt5/plugins" "$HERE/lib/x86_64-linux-gnu/qt5/plugins" "$HERE/lib/qt5/plugins"; do
              [ -d "$p" ] && export QT_PLUGIN_PATH="$p" && break
          done
          exec "$HERE/usr/bin/qlcplus" "$@"
          APPRUN
          sed -i 's/^          //' AppDir/AppRun
          chmod +x AppDir/AppRun
          echo "=== AppRun ==="
          cat AppDir/AppRun

      - name: Build AppImage
        run: |
          set -eu
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          # Take the version from variables.pri: its v4 line comes first, while
          # variables.cmake lists the qmlui one first and would yield
          # "5.0.0 Beta 3" - spaces and all.
          ver=$(grep '^!qmlui' variables.pri | sed 's/.*= *//' | tr -d '\r')
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            "QLC+_${ver}-x86_64.AppImage"
          ls -l *.AppImage

      - name: Smoke test
        run: |
          set -eu
          img=$(ls *.AppImage | head -1)
          chmod +x "$img"
          # "offscreen" is not among the bundled platform plugins (only
          # linuxfb, minimal and xcb are), so force "minimal" instead.
          echo "=== --version (proves the binary and bundled Qt load) ==="
          QT_QPA_PLATFORM=minimal ./"$img" --appimage-extract-and-run --version
          echo "=== I/O plugins actually present inside the image ==="
          "./$img" --appimage-extract >/dev/null
          found=$(find squashfs-root -path '*qt5/plugins/qlcplus*' -name 'libartnet.so' | head -1)
          if [ -z "$found" ]; then echo "::error::no QLC+ I/O plugins inside the AppImage"; exit 1; fi
          echo "  found $found"
          rm -rf squashfs-root

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: qlcplus-linux-appimage
          path: "*.AppImage"
          if-no-files-found: error
